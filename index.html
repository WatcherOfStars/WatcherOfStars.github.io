<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141b">
    <title>Engineering Portfolio</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#portfolio">Skip to portfolio</a>

    <header class="site-header">
      <img class="site-banner" src="assets/banner.svg" alt="Portfolio banner">
      <nav class="section-nav" aria-label="Portfolio sections">
        <a href="#section-01">01</a>
        <a href="#section-02">02</a>
        <a href="#section-03">03</a>
      </nav>
    </header>

    <main id="portfolio">
      <!-- Copy a section to add another project, and update its ID and asset paths. -->
      <section class="portfolio-section" id="section-01" aria-label="Portfolio section 01">
        <div class="section-inner">
          <img class="animated-header" src="assets/section-01-header.gif" alt="Section 01 animated header">
          <img class="section-artwork" src="assets/section-01.svg" alt="Section 01 artwork">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
              title="Section 01 video"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>

      <section class="portfolio-section" id="section-02" aria-label="Portfolio section 02">
        <div class="section-inner">
          <img class="animated-header" src="assets/section-02-header.gif" alt="Section 02 animated header">
          <img class="section-artwork" src="assets/section-02.svg" alt="Section 02 artwork">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
              title="Section 02 video"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>

      <section class="portfolio-section" id="section-03" aria-label="Portfolio section 03">
        <div class="section-inner">
          <img class="animated-header" src="assets/section-03-header.gif" alt="Section 03 animated header">
          <img class="section-artwork" src="assets/section-03.svg" alt="Section 03 artwork">
          <div class="video-frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
              title="Section 03 video"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
